<body>
<main>
                  <div class="page" id="page-contact">
                <h2>Me Contacter</h2>
                <div class="contact-content">
                    <div class="contact-info">
                        <div class="contact-item">
                            <span class="contact-icon">📧</span>
                            <div>
                                <h4>Email</h4>
                                <p>celeste.ngola@example.com</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="contact-icon">📱</span>
                            <div>
                                <h4>Téléphone</h4>
                                <p>+33 6 12 34 56 78</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="contact-icon">📍</span>
