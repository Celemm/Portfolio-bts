<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Celeste Ngola</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/contact.css">
</head>

<body>

  <div class="page-hero">
    <div class="num">005</div>
    <h1 class="page-title">
      Me contacter<br>
      <span class="light">discutons.</span>
    </h1>
  </div>

  <div class="contact-layout">

    <!-- Infos -->
    <div class="contact-infos">
      <div class="contact-item">
        <div class="contact-label">Email</div>
        <a href="mailto:ngolaceleste@gmail.com" class="contact-value">ngolaceleste@gmail.com</a>
      </div>
      <div class="contact-item">
        <div class="contact-label">Téléphone</div>
        <div class="contact-value">+33 7 67 14 92 93</div>
      </div>
      <div class="contact-item">
        <div class="contact-label">Localisation</div>
        <div class="contact-value">Paris, France</div>
      </div>
      <div class="contact-item">
        <div class="contact-label">LinkedIn</div>
        <a href="https://www.linkedin.com/in/ngola-celeste-0b1191333/" target="_blank"
          class="contact-value">linkedin.com/in/celeste-ngola</a>
      </div>
    </div>

    <!-- Formulaire -->
    <form class="contact-form" action="https://formspree.io/f/xnjwpkal" method="POST">
      <h3>Envoyer un message</h3>
      <input type="text" name="name" placeholder="Votre nom" required>
      <input type="email" name="email" placeholder="Votre email" required>
      <textarea name="message" placeholder="Votre message..." rows="5" required></textarea>
      <button type="submit" class="btn">Envoyer →</button>
    </form>

  </div>

  <footer>&copy; Portfolio — Celeste Ngola — 2026</footer>

  <script src="./js/header.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/dark-mode.js"></script>
</body>

</html>
