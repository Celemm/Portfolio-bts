<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="./css/main.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 Page Secrète</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a0a00;
      --yellow: #ffd23f;
      --orange: #ff6b35;
      --green: #06d6a0;
      --blue: #118ab2;
      --pink: #ef476f;
      --white: #fffae8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--white);
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Formes flottantes */
    .shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

    .shape {
      position: absolute;
      border: 3px solid var(--ink);
      animation: float 5s ease-in-out infinite;
    }

    .s1 { width: 80px; height: 80px; background: var(--yellow); border-radius: 50%; top: 5%; left: 4%; animation-delay: 0s; }
    .s2 { width: 55px; height: 55px; background: var(--pink); top: 15%; right: 6%; transform: rotate(20deg); animation-delay: 0.8s; }
    .s3 { width: 90px; height: 36px; background: var(--green); border-radius: 50%; top: 55%; left: 2%; animation-delay: 1.5s; }
    .s4 { width: 45px; height: 45px; background: var(--orange); border-radius: 50%; bottom: 18%; right: 4%; animation-delay: 0.4s; }
    .s5 { width: 65px; height: 65px; background: var(--blue); transform: rotate(45deg); bottom: 8%; left: 6%; animation-delay: 1.2s; }
    .s6 { width: 40px; height: 40px; background: var(--yellow); top: 40%; right: 2%; border-radius: 50%; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    /* Page */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
      text-align: center;
    }

    /* Badge */
    .badge {
      background: var(--pink);
      color: #fff;
      font-family: 'Lilita One', sans-serif;
      font-size: 14px;
      padding: 7px 20px;
      border-radius: 100px;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      margin-bottom: 1.5rem;
      display: inline-block;
      transform: rotate(-1.5deg);
      animation: pop 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes pop {
      0%   { transform: scale(0) rotate(-5deg); }
      70%  { transform: scale(1.15) rotate(-1deg); }
      100% { transform: scale(1) rotate(-1.5deg); }
    }

    h1 {
      font-family: 'Lilita One', sans-serif;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 1.0;
      margin-bottom: 0.75rem;
      animation: up 0.6s ease-out 0.2s both;
    }

    h1 .l1 { display: block; color: var(--ink); }
    h1 .l2 { display: block; color: var(--orange); -webkit-text-stroke: 2px var(--ink); text-shadow: 5px 5px 0 var(--ink); }
    h1 .l3 { display: block; color: var(--yellow); -webkit-text-stroke: 2px var(--ink); text-shadow: 5px 5px 0 var(--ink); }

    @keyframes up {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .sub {
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      color: #3d2c1e;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      animation: up 0.6s ease-out 0.35s both;
    }

    /* Cards */
    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      max-width: 680px;
      margin-bottom: 2.5rem;
      animation: up 0.6s ease-out 0.5s both;
    }

    .card {
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 1.3rem 1.5rem;
      font-weight: 900;
      font-size: 0.95rem;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 150px;
    }

    .card:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0 var(--ink); }
    .card .e { font-size: 2rem; display: block; margin-bottom: 0.3rem; }

    .c1 { background: var(--green); }
    .c2 { background: var(--yellow); }
    .c3 { background: var(--blue); color: #fff; }
    .c4 { background: var(--pink); color: #fff; }

    /* Confettis */
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }

    .bit {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Bouton retour */
    .back {
      background: var(--ink);
      color: var(--white);
      font-family: 'Lilita One', sans-serif;
      font-size: 1.1rem;
      border: 3px solid var(--ink);
      border-radius: 100px;
      padding: 13px 30px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
      text-decoration: none;
      display: inline-block;
      animation: up 0.6s ease-out 0.65s both;
    }

    .back:hover { background: var(--orange); transform: translate(-2px,-2px); }

    .counter {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink);
      opacity: 0.4;
      animation: up 0.6s ease-out 0.8s both;
    }
  </style>
</head>
<body>

  <!-- Formes -->
  <div class="shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
  </div>

  <!-- Confettis -->
  <div class="confetti" id="confetti"></div>

  <!-- Contenu -->
  <div class="page">
    <div class="badge">🔓 Tu as trouvé la page secrète !</div>

    <h1>
      <span class="l1">Bien joué</span>
      <span class="l2">Celeste</span>
      <span class="l3">🎉</span>
    </h1>

    <p class="sub">
      Tu as exploré le portfolio jusqu'au bout — c'est exactement l'esprit curieux
      qu'il faut avoir en développement !
    </p>

    <div class="cards">
      <div class="card c1"><span class="e">💻</span>Développeur Android</div>
      <div class="card c2"><span class="e">🔭</span>En veille constante</div>
      <div class="card c3"><span class="e">🚀</span>BTS SIO SLAM</div>
      <div class="card c4"><span class="e">🍳</span>Fan de cuisine</div>
    </div>

    <a href="profil.html" class="back">← Retour au profil</a>

    <div class="counter">👁️ Visiteur n° <span id="num">…</span></div>
  </div>

  <script>
    /* Confettis */
    const colors = ['#ffd23f','#ff6b35','#06d6a0','#118ab2','#ef476f'];
    const wrap = document.getElementById('confetti');

    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = 'bit';
      el.style.left             = Math.random() * 100 + 'vw';
      el.style.background       = colors[Math.floor(Math.random() * colors.length)];
      el.style.width            = (8 + Math.random() * 10) + 'px';
      el.style.height           = (8 + Math.random() * 10) + 'px';
      el.style.animationDuration = (3 + Math.random() * 5) + 's';
      el.style.animationDelay   = (Math.random() * 4) + 's';
      wrap.appendChild(el);
    }

    /* Compteur visites */
    let v = parseInt(localStorage.getItem('sv') || '0') + 1;
    localStorage.setItem('sv', v);
    document.getElementById('num').textContent = v;
  </script>
  <script src="./js/header.js"></script>
  <script src="./js/dark-mode.js"></script>
</body>
</html>
